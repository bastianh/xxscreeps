<!-- The bands are dashed circles rather than drawn segments: a dash pattern summing to the
     circumference divides evenly, so `2πr / n` sets the pitch and the dash sets the block. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128"><defs><g id="badge"><rect x="55" y="4" width="18" height="12" rx="2.5" fill="#ffc46b"/><path d="M58 7.5 L62.4 12.5 M62.4 7.5 L58 12.5 M65.6 7.5 L70 12.5 M70 7.5 L65.6 12.5" fill="none" stroke="#2a1008" stroke-width="1.8" stroke-linecap="round"/></g></defs><circle cx="64" cy="64" r="50" fill="#1b0a05" opacity="0.32"/><g fill="none"><circle cx="64" cy="64" r="61" stroke="#ff8a4d" stroke-width="5" stroke-dasharray="6 9.97" opacity="0.45"/><circle cx="64" cy="64" r="54" stroke="#c4571f" stroke-width="9" stroke-dasharray="5 3.482" opacity="0.9"/><circle cx="64" cy="64" r="44" stroke="#ffc46b" stroke-width="1.6" stroke-dasharray="0.01 4.598" stroke-linecap="round" opacity="0.7"/></g><use href="#badge"/><use href="#badge" transform="rotate(60 64 64)"/><use href="#badge" transform="rotate(120 64 64)"/><use href="#badge" transform="rotate(180 64 64)"/><use href="#badge" transform="rotate(240 64 64)"/><use href="#badge" transform="rotate(300 64 64)"/></svg>
