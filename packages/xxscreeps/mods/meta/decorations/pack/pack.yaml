name: xxscreeps

themes:
  xx-basic: { name: Basics, color: '#8f8f8f' }
  xx-ember: { name: Ember, color: '#c4571f' }
  xx-neon: { name: Neon, color: '#ff4fd8' }

decorations:
  xx-floor-plain:
    type: floorLandscape
    name: Plain Floor
    theme: xx-basic
    rarity: 1
    groupDescription: Recolors the floor, the swamps and the roads of a room.
    props:
      floorBackgroundColor: { type: color, label: Floor, default: '#2b2b2b' }
      floorBackgroundBrightness: { type: range, label: Floor brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      swampColor: { type: color, label: Swamp, default: '#23301f' }
      swampStrokeColor: { type: color, label: Swamp border, default: '#3a4a33' }
      swampStrokeWidth: { type: range, label: Swamp border width, min: 0, max: 60, step: 1, default: 30 }
      roadsColor: { type: color, label: Roads, default: '#2f2f2f' }
      roadsBrightness: { type: range, label: Road brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      world: { type: boolean, label: Show on the world map, default: true }

  xx-wall-plain:
    type: wallLandscape
    name: Plain Walls
    theme: xx-basic
    rarity: 1
    groupDescription: Recolors the walls of a room.
    props:
      backgroundColor: { type: color, label: Wall, default: '#111111' }
      backgroundBrightness: { type: range, label: Wall brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      strokeColor: { type: color, label: Wall border, default: '#2b2b2b' }
      strokeBrightness: { type: range, label: Border brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      strokeWidth: { type: range, label: Border width, min: 0, max: 60, step: 1, default: 10 }
      strokeLighting: { type: range, label: Border glow, min: 0, max: 1, step: 0.01, default: 0 }
      world: { type: boolean, label: Show on the world map, default: true }

  xx-floor-ember:
    type: floorLandscape
    name: Ember Floor
    theme: xx-ember
    rarity: 2
    groupDescription: Ash underfoot, cooling magma in the swamps, and the XX mark burnt into the ground.
    # The overlay is authored for the official client, which tiles it only when the definition
    # carries a `tileScale` and reads that value in its own world units — `CELL_SIZE` 100 to a
    # tile. The artwork is 500px holding two marks in a half-drop, so at scale 2 one repeat spans
    # ten tiles and the marks land every ten tiles across, offset by half that on every other row.
    floorForegroundUrl: art/xx-mark.svg
    tileScale: 2
    props:
      floorBackgroundColor: { type: color, label: Floor, default: '#3a2f2b' }
      floorBackgroundBrightness: { type: range, label: Floor brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      floorForegroundColor: { type: color, label: Mark, default: '#ff8a4d' }
      floorForegroundBrightness: { type: range, label: Mark brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      floorForegroundAlpha: { type: range, label: Mark opacity, min: 0, max: 1, step: 0.01, default: 0.06 }
      # The official client draws the swamp fill and its border at alpha 0.4 over the floor, and
      # then lays additive green noise over both — so this reads as a bog darkening the ash rather
      # than as the near-black it is on its own.
      swampColor: { type: color, label: Swamp, default: '#2a0d04' }
      swampStrokeColor: { type: color, label: Swamp border, default: '#d1691f' }
      swampStrokeWidth: { type: range, label: Swamp border width, min: 0, max: 60, step: 1, default: 30 }
      roadsColor: { type: color, label: Roads, default: '#856f66' }
      roadsBrightness: { type: range, label: Road brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      world: { type: boolean, label: Show on the world map, default: true }

  xx-wall-ember:
    type: wallLandscape
    name: Ember Walls
    theme: xx-ember
    rarity: 2
    groupDescription: Walls of dark red rock, edged in burnt orange.
    props:
      backgroundColor: { type: color, label: Wall, default: '#40190f' }
      backgroundBrightness: { type: range, label: Wall brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      strokeColor: { type: color, label: Wall border, default: '#7a3020' }
      strokeBrightness: { type: range, label: Border brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      strokeWidth: { type: range, label: Border width, min: 0, max: 60, step: 1, default: 14 }
      strokeLighting: { type: range, label: Border glow, min: 0, max: 1, step: 0.01, default: 0 }
      world: { type: boolean, label: Show on the world map, default: true }

  xx-ring:
    type: object
    name: XX Ring
    theme: xx-ember
    rarity: 3
    groupDescription: A studded ring set around a room's controller, marked six times over.
    objectType: controller
    # The ring carries its own colors rather than naming a `color` property, the way the official
    # season sets do: a wreath of three shades reads as one object, and a single tint over the lot
    # would flatten it back into an outline.
    graphics:
      - { url: art/ring.svg, alpha: alpha }
    # The artwork is the preview. It is already a self-contained drawing on a dark seat, so a card
    # of its own would be the same picture kept in a second place.
    preview:
      original: art/ring.svg
      128x128: art/ring.svg
      256x256: art/ring.svg
    props:
      # The renderer sizes the sprite in its own world units, 100 to a tile. 350 is what the
      # official season servers give their controller ring, and it wears the same on ours.
      width: { type: range, label: Width, min: 150, max: 500, step: 1, default: 350 }
      height: { type: range, label: Height, min: 150, max: 500, step: 1, default: 350 }
      alpha: { type: range, label: Opacity, min: 0, max: 1, step: 0.01, default: 1 }
      lighting: { type: boolean, label: Glow, default: false }
      animation: { type: string, label: Animation, default: '' }

  xx-floor-neon:
    type: floorLandscape
    name: Neon Floor
    theme: xx-neon
    rarity: 2
    groupDescription: A floor that leans into the color picker.
    props:
      floorBackgroundColor: { type: color, label: Floor, default: '#1b0f2b' }
      floorBackgroundBrightness: { type: range, label: Floor brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      swampColor: { type: color, label: Swamp, default: '#2b0f3f' }
      swampStrokeColor: { type: color, label: Swamp border, default: '#ff4fd8' }
      swampStrokeWidth: { type: range, label: Swamp border width, min: 0, max: 60, step: 1, default: 30 }
      roadsColor: { type: color, label: Roads, default: '#ff4fd8' }
      roadsBrightness: { type: range, label: Road brightness, min: 0.2, max: 1, step: 0.01, default: 0.6 }
      world: { type: boolean, label: Show on the world map, default: true }

  xx-room-neon:
    type: landscape
    name: Neon Room
    theme: xx-neon
    rarity: 3
    groupDescription: Floor and walls in one — takes the whole room.
    props:
      floorBackgroundColor: { type: color, label: Floor, default: '#140a1f' }
      floorBackgroundBrightness: { type: range, label: Floor brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      swampColor: { type: color, label: Swamp, default: '#22103a' }
      swampStrokeColor: { type: color, label: Swamp border, default: '#8f4fff' }
      swampStrokeWidth: { type: range, label: Swamp border width, min: 0, max: 60, step: 1, default: 30 }
      roadsColor: { type: color, label: Roads, default: '#8f4fff' }
      roadsBrightness: { type: range, label: Road brightness, min: 0.2, max: 1, step: 0.01, default: 0.7 }
      backgroundColor: { type: color, label: Wall, default: '#090412' }
      backgroundBrightness: { type: range, label: Wall brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      strokeColor: { type: color, label: Wall border, default: '#ff4fd8' }
      strokeBrightness: { type: range, label: Border brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      strokeWidth: { type: range, label: Border width, min: 0, max: 60, step: 1, default: 14 }
      strokeLighting: { type: range, label: Border glow, min: 0, max: 1, step: 0.01, default: 0 }
      world: { type: boolean, label: Show on the world map, default: true }

  xx-tag:
    type: wallGraffiti
    name: Tag
    theme: xx-basic
    rarity: 2
    groupDescription: A stencil sprayed onto the walls of a room. Drag it where you want it.
    graphics:
      - { url: art/tag.svg, color: color }
    preview:
      original: art/tag-preview.svg
      128x128: art/tag-preview.svg
      256x256: art/tag-preview.svg
    layout: { proportional: true, minWidth: 1, maxWidth: 12, minHeight: 1, maxHeight: 12 }
    props:
      x: { type: range, label: Left, min: 0, max: 49, step: 1, default: 24 }
      y: { type: range, label: Top, min: 0, max: 49, step: 1, default: 24 }
      width: { type: range, label: Width, min: 1, max: 12, step: 1, default: 3 }
      height: { type: range, label: Height, min: 1, max: 12, step: 1, default: 3 }
      alpha: { type: range, label: Opacity, min: 0, max: 1, step: 0.01, default: 1 }
      color: { type: color, label: Paint, default: '#dcdcdc' }
      brightness: { type: range, label: Brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      rotation: { type: range, label: Rotation, min: 0, max: 6.28, step: 0.01, default: 0 }
      flip: { type: boolean, label: Flip, default: false }
      lighting: { type: boolean, label: Glow, default: false }
      animation: { type: string, label: Animation, default: '' }
      world: { type: boolean, label: Show on the world map, default: true }

  xx-orbit:
    type: creep
    name: Orbit
    theme: xx-basic
    rarity: 2
    groupDescription: A ring that follows your creeps around. It names no room of its own.
    graphics:
      - { url: art/orbit.svg, color: color }
    preview:
      original: art/orbit-preview.svg
      128x128: art/orbit-preview.svg
      256x256: art/orbit-preview.svg
    props:
      width: { type: range, label: Width, min: 20, max: 200, step: 1, default: 90 }
      height: { type: range, label: Height, min: 20, max: 200, step: 1, default: 90 }
      nameFilter: { type: string, label: Creep names, default: '' }
      exclude: { type: boolean, label: Skip the names above, default: false }
      color: { type: color, label: Ring, default: '#dcdcdc' }
      brightness: { type: range, label: Brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      syncRotate: { type: boolean, label: Turn with the creep, default: false }
      lighting: { type: boolean, label: Glow, default: false }
      animation: { type: string, label: Animation, default: '' }

  xx-halo:
    type: object
    name: Halo
    theme: xx-basic
    rarity: 3
    groupDescription: A ring drawn around every spawn of yours in the room.
    objectType: spawn
    graphics:
      - { url: art/halo.svg, color: color, alpha: alpha }
    preview:
      original: art/halo-preview.svg
      128x128: art/halo-preview.svg
      256x256: art/halo-preview.svg
    props:
      width: { type: range, label: Width, min: 40, max: 250, step: 1, default: 150 }
      height: { type: range, label: Height, min: 40, max: 250, step: 1, default: 150 }
      alpha: { type: range, label: Opacity, min: 0, max: 1, step: 0.01, default: 1 }
      color: { type: color, label: Ring, default: '#dcdcdc' }
      brightness: { type: range, label: Brightness, min: 0.2, max: 1, step: 0.01, default: 1 }
      lighting: { type: boolean, label: Glow, default: false }
      animation: { type: string, label: Animation, default: '' }

  xx-crate:
    type: metadata
    name: Crate
    theme: xx-basic
    rarity: 4
    groupDescription: Redraws containers as a wooden crate. A skin replaces how the client draws a kind of object, so it has nothing for the player to edit.
    objectType: container
    resources:
      xx-crate: art/crate.svg
    metadata:
      texture: xx-crate
      processors:
        - { type: sprite, id: crate, once: true, payload: { width: 60, height: 70 } }
      zIndex: 4
    preview:
      original: art/crate-preview.svg
      128x128: art/crate-preview.svg
      256x256: art/crate-preview.svg
    props: {}

  xx-chevrons:
    type: badge
    name: Chevrons
    theme: xx-basic
    rarity: 3
    groupDescription: A symbol for your account badge. Activate it, then pick it in the badge editor — the colors are yours to choose there.
    badge:
      path1: M 50 8 L 96 54 L 78 54 L 50 26 L 22 54 L 4 54 Z
      path2: M 50 46 L 96 92 L 78 92 L 50 64 L 22 92 L 4 92 Z
    props: {}
