apiVersion: apps/v1
kind: Deployment
metadata:
  name: xxscreeps
  namespace: xxscreeps
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xxscreeps
  template:
    metadata:
      labels:
        app: xxscreeps
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "21025"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: registry-credentials
      initContainers:
        - name: seed-archives
          image: xxscreeps
          command: ["sh", "-c", "mkdir -p /data/screeps/archive && cp -n /opt/archive-seed/*.js /data/screeps/archive/ 2>/dev/null; true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: schema-archive
              mountPath: /data/screeps
      containers:
        - name: main
          image: xxscreeps
          args: ["main"]
          workingDir: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 1Gi
          env:
            - name: SCREEPS_MOD_CLIENT_MOUNT_PATH
              value: "/"
            - name: XXSCREEPS_BACKEND_SECRET
              valueFrom:
                secretKeyRef:
                  name: xxscreeps-secrets
                  key: backend-secret
            - name: XXSCREEPS_STEAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xxscreeps-secrets
                  key: steam-api-key
          volumeMounts:
            - name: schema-archive
              mountPath: /data/screeps
            - name: config
              mountPath: /data/.screepsrc.yaml
              subPath: .screepsrc.yaml
        - name: processor
          image: xxscreeps
          args: ["processor"]
          workingDir: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 20Gi
          env:
            - name: SCREEPS_MOD_CLIENT_MOUNT_PATH
              value: "/"
            - name: XXSCREEPS_BACKEND_SECRET
              valueFrom:
                secretKeyRef:
                  name: xxscreeps-secrets
                  key: backend-secret
            - name: XXSCREEPS_STEAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xxscreeps-secrets
                  key: steam-api-key
          volumeMounts:
            - name: schema-archive
              mountPath: /data/screeps
            - name: config
              mountPath: /data/.screepsrc.yaml
              subPath: .screepsrc.yaml
        - name: runner
          image: xxscreeps
          args: ["runner"]
          workingDir: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 16Gi
          env:
            - name: SCREEPS_MOD_CLIENT_MOUNT_PATH
              value: "/"
            - name: XXSCREEPS_BACKEND_SECRET
              valueFrom:
                secretKeyRef:
                  name: xxscreeps-secrets
                  key: backend-secret
            - name: XXSCREEPS_STEAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xxscreeps-secrets
                  key: steam-api-key
          volumeMounts:
            - name: schema-archive
              mountPath: /data/screeps
            - name: config
              mountPath: /data/.screepsrc.yaml
              subPath: .screepsrc.yaml
        - name: backend
          image: xxscreeps
          args: ["backend"]
          workingDir: /data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 2Gi
          env:
            - name: SCREEPS_MOD_CLIENT_MOUNT_PATH
              value: "/"
            - name: XXSCREEPS_BACKEND_SECRET
              valueFrom:
                secretKeyRef:
                  name: xxscreeps-secrets
                  key: backend-secret
            - name: XXSCREEPS_STEAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: xxscreeps-secrets
                  key: steam-api-key
          ports:
            - containerPort: 21025
          volumeMounts:
            - name: schema-archive
              mountPath: /data/screeps
            - name: config
              mountPath: /data/.screepsrc.yaml
              subPath: .screepsrc.yaml
          livenessProbe:
            tcpSocket:
              port: 21025
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /metrics
              port: 21025
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
      volumes:
        - name: schema-archive
          persistentVolumeClaim:
            claimName: xxscreeps-schema-archive
        - name: config
          configMap:
            name: xxscreeps-config
