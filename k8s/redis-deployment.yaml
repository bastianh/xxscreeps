apiVersion: apps/v1
kind: Deployment
metadata:
  name: xxscreeps-redis
  namespace: xxscreeps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xxscreeps-redis
  template:
    metadata:
      labels:
        app: xxscreeps-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:8.6
          args: ["redis-server", "/usr/local/etc/redis/redis.conf"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: config
              mountPath: /usr/local/etc/redis/redis.conf
              subPath: redis.conf
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: xxscreeps-redis-data
        - name: config
          configMap:
            name: xxscreeps-config
